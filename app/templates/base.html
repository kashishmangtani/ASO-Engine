<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ agency }} · AI Visibility{% endblock %}</title>
<style>
:root{--brand:{{ color }};--bg:#f6f7fb;--card:#fff;--ink:#14161f;--muted:#646b7d;--line:#e4e7ef;--good:#0f9d58;--warn:#e8a200;--bad:#d93025}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:12px}
header .logo{width:28px;height:28px;border-radius:8px;background:var(--brand)}header b{font-size:17px}
main{max-width:1180px;margin:0 auto;padding:24px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:16px 0 8px}
.muted{color:var(--muted)}.small{font-size:13px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi .v{font-size:28px;font-weight:700}.kpi .l{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.btn{display:inline-block;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}.btn.danger{background:var(--bad)}
.btn:hover{opacity:.9;text-decoration:none}
input,textarea,select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
label{font-size:13px;font-weight:600;display:block;margin:10px 0 4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#eef0f6;color:var(--muted)}
.pill.good{background:#e3f5ea;color:var(--good)}.pill.bad{background:#fde7e5;color:var(--bad)}.pill.warn{background:#fff4d6;color:#9a6b00}
.bar{height:8px;background:#eef0f6;border-radius:99px;overflow:hidden}.bar>span{display:block;height:100%;background:var(--brand)}
.score{font-size:44px;font-weight:800}
details summary{cursor:pointer}pre,code{background:#f1f3f8;border-radius:6px}pre{padding:12px;overflow:auto;white-space:pre-wrap}
.answer{white-space:pre-wrap;font-size:13px;max-height:260px;overflow:auto;background:#fafbfd;border:1px solid var(--line);border-radius:8px;padding:10px}
.plan h1,.plan h2{font-size:18px;margin-top:20px}.plan table{font-size:14px}
@media print{header,.noprint{display:none!important}body{background:#fff}.card{border:0;padding:0}}
</style>
</head>
<body>
<header class="noprint"><span class="logo"></span><b><a href="/app" style="color:inherit">{{ agency }}</a></b><span class="muted">AI Search Visibility Platform</span><nav style="margin-left:auto" class="row"><a href="/app">Clients</a><a href="/app/leads">Leads</a><a href="/" target="_blank">Public site ↗</a></nav></header>
<main>{% block body %}{% endblock %}</main>
</body></html>
